/**:
  ros__parameters:
    # Input/output topics are relative to the node namespace.
    image_topic: "image_raw"
    camera_info_topic: "image_raw/camera_info"
    debug_lights_topic: "detector/debug_lights"
    lights_topic: "detector/lights"
    dart_states_topic: "detector/dart_states"
    result_image_topic: "detector/result_image"

    # Camera source type.
    # 0: grayscale camera, input image is mono8.
    # 1: color camera, input image is bgr8 and will be converted to mono8 before detection.
    # 目前还是先采用彩色的
    camera_type: 1

    # Camera optical axis and dart launch direction have the same fixed pitch.
    # This value is also used as the ballistic launch angle.
    camera_pitch_deg: 33.0

    # Guide light geometry and nominal operating distance.
    physical_diameter_m: 0.055
    expected_distance_m: 25.0
    expected_diameter_tolerance: 0.60

    # Normalized horizontal error for the centered state.
    middle_error_ratio: 0.03

    # Dart and atmosphere parameters.
    dart_mass_kg: 0.05
    dart_cross_section_area_m2: 0.0001
    drag_coefficient: 0.47
    air_density_kg_m3: 1.225
    target_height_difference_m: 0.0

    # Spring energy model: force is the average equivalent spring pulling force.
    spring_effective_stroke_m: 0.10
    launch_efficiency: 0.80

    # Ballistic numerical integration parameters.
    gravity_m_s2: 9.81
    ballistic_integration_time_step_s: 0.001
    ballistic_max_initial_speed_mps: 200.0

    # mono8 thresholding and binary-mask cleanup.
    threshold: 180
    blur_kernel_size: 3
    open_kernel_size: 3
    close_kernel_size: 3

    # Candidate contour filters.
    min_area: 4.0
    max_area: 5000.0
    min_diameter_px: 3.0
    max_diameter_px: 200.0
    min_circularity: 0.50
    min_fill_ratio: 0.40
    max_aspect_ratio: 2.0

    # Normalized image ROI: [0, 1] in x/y.
    roi_x_min: 0.0
    roi_x_max: 1.0
    roi_y_min: 0.0
    roi_y_max: 1.0
